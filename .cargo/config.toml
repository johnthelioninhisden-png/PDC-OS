[build]
# Compile for a freestanding target instead of the host operating system.
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# The kernel is linked at fixed addresses and uses the kernel code model.
# panic=abort avoids unwinding, which is not supported in this no_std image.
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "panic=abort",
]
