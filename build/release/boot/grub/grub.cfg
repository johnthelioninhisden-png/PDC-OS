# PDC-OS release 0.1.0
# Boot the default entry immediately, including in the headless smoke test.
set timeout=0
# Select the first (and currently only) boot entry by default.
set default=0

menuentry "PDC-OS" {
    # Load the kernel image using the Multiboot protocol expected by boot.asm.
    multiboot /boot/pdc-os.kernel
    boot
}
